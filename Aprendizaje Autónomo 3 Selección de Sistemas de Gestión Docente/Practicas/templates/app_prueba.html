<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Python-Preguntas-Abiertas</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

                    <label>Nombres:</label>
                    <input type="text" name="nombres" class="form-control mb-3" placeholder="Coloque su nombre aquí">

                    <input type="text" name="apellidos" class="form-control mb-3" placeholder="Coloque su apellido aquí">

        </div>
