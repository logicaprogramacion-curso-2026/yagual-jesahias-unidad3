<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Evaluación Formativa de Competencias Docentes{% endblock %}</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet">
</head>
<body>

  <nav class="navbar navbar-dark bg-primary mb-4 shadow-sm">
    <div class="container">
      <span class="navbar-brand mb-0 h1">
        <i class="bi bi-easel2-fill me-2"></i>
        Evaluación Formativa de Competencias Docentes
      </span>
    </div>
  </nav>

  <main class="container pb-5">
    {% block content %}{% endblock %}
  </main>

  <footer class="text-center text-muted small pb-4">
    Herramienta de autoevaluación formativa &middot; los datos no se almacenan de forma permanente
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
